<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoadD.Vo — LMS & Exam System 3.0</title>
    <meta name="description" content="Hệ thống quản lý học tập và thi trực tuyến cho giáo viên và học sinh">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --primary: #4F46E5;
            --primary-dark: #4338CA;
            --secondary: #8B5CF6;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        /* ---- Animated Background ---- */
        .bg-animated {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 50%, #2563EB 100%);
            z-index: -1;
        }

        .bg-animated::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        .floating-shapes {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            animation: float 15s infinite ease-in-out;
        }

        .shape:nth-child(1) { width: 300px; height: 300px; top: -100px; left: -100px; animation-delay: 0s; }
        .shape:nth-child(2) { width: 200px; height: 200px; top: 50%; right: -50px; animation-delay: -5s; }
        .shape:nth-child(3) { width: 150px; height: 150px; bottom: -50px; left: 40%; animation-delay: -10s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }

        /* ---- Card ---- */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            box-shadow:
                0 25px 50px rgba(79, 70, 229, 0.2),
                0 0 0 1px rgba(255, 255, 255, 0.3);
        }

        /* ---- Tabs ---- */
        .role-tab {
            flex: 1;
            padding: 14px 20px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .role-tab.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
        }

        .role-tab:not(.active) {
            background: transparent;
            color: #64748B;
        }

        .role-tab:not(.active):hover {
            background: #F1F5F9;
            color: #334155;
        }

        /* ---- Inputs ---- */
        .form-input {
            width: 100%;
            background: #F8FAFC;
            border: 2px solid #E2E8F0;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #0F172A;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
            background: white;
        }

        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }

        /* ---- Buttons ---- */
        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 14px 24px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .btn-student {
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
        }

        .btn-student:hover {
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
        }

        /* ---- Links ---- */
        .text-link {
            color: var(--primary);
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: color 0.2s;
            text-decoration: none;
        }

        .text-link:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        /* ---- Info box ---- */
        .info-box {
            background: linear-gradient(135deg, #EEF2FF 0%, #F3E8FF 100%);
            border: 1px solid #C7D2FE;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 12px;
            color: #3730A3;
            line-height: 1.6;
        }

        /* ---- Logo ---- */
        .logo-gradient {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ---- Divider ---- */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 8px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #E2E8F0;
        }

        /* ---- Toast ---- */
        #toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1E293B;
            color: white;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 9999;
            max-width: 360px;
        }
        #toast.show { transform: translateY(0); opacity: 1; }
        #toast.success { background: #065F46; }
        #toast.error { background: #7F1D1D; }
        #toast.info { background: #1E3A8A; }

        /* ---- Form switch animation ---- */
        .auth-form {
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .auth-form.hidden {
            display: none;
        }

        /* ---- Feature pills ---- */
        .feature-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.15);
            color: white;
            padding: 6px 14px;
            border-radius: 99px;
            font-size: 11px;
            font-weight: 700;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-animated"></div>
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <!-- Toast notification -->
    <div id="toast">
        <i data-lucide="check-circle" class="w-5 h-5 shrink-0"></i>
        <span id="toastMsg">Thông báo</span>
    </div>

    <!-- Main content -->
    <div class="min-h-screen flex flex-col items-center justify-center p-4 md:p-6">

        <!-- Header branding -->
        <div class="text-center mb-8">
            <h1 class="text-5xl font-black text-white tracking-tight drop-shadow-lg">
                NoadD<span class="text-yellow-300">.Vo</span>
            </h1>
            <p class="text-white/80 text-sm font-semibold mt-2 tracking-widest uppercase">
                LMS & EXAM SYSTEM 3.0
            </p>
        </div>

        <!-- Auth Card -->
        <div class="glass-card w-full max-w-md p-8">

            <!-- Role Selector Tabs -->
            <div class="flex gap-2 bg-slate-100 p-1.5 rounded-2xl mb-8">
                <button
                    id="tabTeacher"
                    class="role-tab active"
                    onclick="switchTab('teacher')"
                >
                    <i data-lucide="graduation-cap" class="w-4 h-4"></i>
                    Giáo Viên
                </button>
                <button
                    id="tabStudent"
                    class="role-tab"
                    onclick="switchTab('student')"
                >
                    <i data-lucide="user" class="w-4 h-4"></i>
                    Học Sinh
                </button>
            </div>

            <!-- ===== GIÁO VIÊN FORM (TÀI KHOẢN TỰ CẤP - BẢO MẬT) ===== -->
            <div id="teacherForm" class="auth-form">
                <div class="mb-6 text-center">
                    <h2 class="text-xl font-black text-slate-800 tracking-tight">
                        Cổng Giáo Viên Quản Trị
                    </h2>
                    <p class="text-xs text-slate-500 mt-1">Đăng nhập bằng tài khoản được phân quyền</p>
                </div>

                <div class="space-y-4">
                    <!-- Email -->
                    <div>
                        <label class="form-label">Tài khoản Email</label>
                        <input type="email" id="teacherEmail" class="form-input"
                            placeholder="giaovien@gmail.com"
                            autocomplete="off"
                            onkeydown="if(event.key==='Enter') handleTeacherAuth()">
                    </div>

                    <!-- Mật khẩu -->
                    <div>
                        <label class="form-label">Mật khẩu</label>
                        <div class="relative">
                            <input type="password" id="teacherPassword" class="form-input pr-12"
                                placeholder="••••••••"
                                autocomplete="off"
                                onkeydown="if(event.key==='Enter') handleTeacherAuth()">
                            <button type="button" onclick="togglePassword('teacherPassword')"
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                                <i data-lucide="eye" class="w-4 h-4" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>

                    <button type="button" onclick="handleTeacherAuth()" class="btn-primary mt-2">
                        <i data-lucide="shield-check" class="w-4 h-4"></i>
                        <span>Đăng Nhập Quản Lý</span>
                    </button>
                </div>
            </div>

            <!-- ===== HỌC SINH FORM ===== -->
            <div id="studentForm" class="auth-form hidden">
                <h2 class="text-lg font-black text-slate-800 mb-6">Vào phòng thi</h2>

                <div class="space-y-4">
                    <!-- Mã đề thi -->
                    <div>
                        <label class="form-label">Mã đề thi</label>
                        <input type="text" id="examCode" class="form-input font-mono text-xl text-center tracking-widest font-bold"
                            placeholder="123456"
                            maxlength="6"
                            inputmode="numeric"
                            pattern="[0-9]*"
                            autocomplete="off"
                            oninput="this.value=this.value.replace(/[^0-9]/g, '')"
                            onkeydown="if(event.key==='Enter') handleStudentEnter()">
                        <p class="text-xs text-slate-400 mt-1 text-center">Do giáo viên cung cấp (chỉ gồm các chữ số)</p>
                    </div>

                    <div class="divider">
                        <span class="text-xs text-slate-400 font-semibold">THÔNG TIN HỌC SINH</span>
                    </div>

                    <!-- Họ tên -->
                    <div>
                        <label class="form-label">Họ và tên</label>
                        <input type="text" id="studentName" class="form-input"
                            placeholder="Nguyễn Văn A">
                    </div>

                    <!-- Lớp -->
                    <div>
                        <label class="form-label">Lớp</label>
                        <input type="text" id="studentClass" class="form-input"
                            placeholder="6A1">
                    </div>

                    <button onclick="handleStudentEnter()" class="btn-primary btn-student mt-2">
                        <i data-lucide="play-circle" class="w-4 h-4"></i>
                        Bắt Đầu Làm Bài
                    </button>
                </div>
            </div>

    </div>

    <!-- Scripts -->
    <script src="assets/js/core/default-exam.js"></script>
    <script src="assets/js/core/storage.js"></script>

    <script>
        // ============================================================
        // UI STATE
        // ============================================================
        let currentTab = 'teacher';
        let teacherMode = 'login'; // 'login' | 'register'

        // ============================================================
        // ICONS INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            checkAutoLogin();
        });

        /**
         * Kiểm tra nếu đã đăng nhập → chuyển thẳng vào studio
         */
        function checkAutoLogin() {
            const user = Storage.Auth.getCurrentUser();
            if (user && user.role === 'teacher') {
                window.location.href = 'studio.html';
            }
        }

        // ============================================================
        // TAB SWITCHING
        // ============================================================
        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('teacherForm').classList.toggle('hidden', tab !== 'teacher');
            document.getElementById('studentForm').classList.toggle('hidden', tab !== 'student');
            document.getElementById('tabTeacher').classList.toggle('active', tab === 'teacher');
            document.getElementById('tabStudent').classList.toggle('active', tab === 'student');
            lucide.createIcons();
        }

        // ============================================================
        // TEACHER AUTH & OTP VERIFICATION
        // ============================================================
        let currentGeneratedOtp = null;
        let otpCountdown = 0;
        let otpTimerInterval = null;

        // ============================================================
        // TEACHER AUTH (TÀI KHOẢN TỰ CẤP - XÁC THỰC SHA-256)
        // ============================================================
        async function handleTeacherAuth() {
            const email = document.getElementById('teacherEmail').value.trim();
            const password = document.getElementById('teacherPassword').value;

            if (!email) return showToast('Vui lòng nhập email tài khoản!', 'error');
            if (!password) return showToast('Vui lòng nhập mật khẩu!', 'error');

            showToast('Đang xác thực thông tin...', 'info');

            // Gọi hàm login kiểm tra SHA-256 hash từ data/teachers.json
            const result = await Storage.Auth.login(email, password);
            if (!result.success) {
                return showToast(result.message, 'error');
            }

            showToast(`Xin chào, ${result.user.name || 'Giáo viên'}! Đang vào hệ thống...`, 'success');
            setTimeout(() => {
                window.location.href = 'studio.html';
            }, 500);
        }

        // ============================================================
        // BẢO VỆ CHỐNG F12 / F11 / INSPECT ELEMENT / XEM MÃ NGUỒN
        // ============================================================
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            showToast('Chức năng chuột phải bị khóa để bảo vệ hệ thống!', 'warning');
        });

        document.addEventListener('keydown', (e) => {
            // Chặn F12, F11
            if (e.key === 'F12' || e.key === 'F11') {
                e.preventDefault();
                showToast('Chức năng F11/F12 bị khóa để bảo mật quyền quản trị!', 'warning');
                return false;
            }
            // Chặn Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C (Inspect DevTools)
            if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C', 'i', 'j', 'c'].includes(e.key)) {
                e.preventDefault();
                showToast('Không có quyền mở DevTools trên trang này!', 'warning');
                return false;
            }
            // Chặn Ctrl+U (View Source)
            if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) {
                e.preventDefault();
                showToast('Xem mã nguồn bị khóa!', 'warning');
                return false;
            }
        });

        // ============================================================
        // STUDENT ENTRANCE
        // ============================================================
        function handleStudentEnter() {
            const code = document.getElementById('examCode').value.replace(/[^0-9]/g, '').trim();
            const name = document.getElementById('studentName').value.trim();
            const cls = document.getElementById('studentClass').value.trim();
            const id = document.getElementById('studentId')?.value.trim() || '';

            if (!code) return showToast('Vui lòng nhập mã đề thi (chỉ gồm các chữ số)!', 'error');
            if (!name) return showToast('Vui lòng nhập họ và tên!', 'error');

            // Kiểm tra mã đề thi
            const exam = Storage.Exams.getByCode(code);
            if (!exam) return showToast(`Không tìm thấy đề thi "${code}"! Kiểm tra lại mã.`, 'error');
            if (!exam.isActive) return showToast('Đề thi này hiện không hoạt động.', 'error');

            // Lưu session học sinh
            Storage.Session.save({
                examCode: code,
                studentName: name,
                studentClass: cls,
                studentId: id,
                startTime: new Date().toISOString(),
            });

            showToast('Tìm thấy đề thi! Đang vào phòng thi...', 'success');
            setTimeout(() => {
                window.location.href = `exam.html?code=${code}`;
            }, 600);
        }

        // ============================================================
        // UTILITIES
        // ============================================================
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('name', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('name', 'eye');
            }
            lucide.createIcons();
        }

        // ============================================================
        // TOAST
        // ============================================================
        let toastTimeout;
        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = msg;
            toast.className = `show ${type}`;
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
