<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phòng Thi Trực Tuyến</title>
    <meta name="description" content="Làm bài kiểm tra trực tuyến">
    <meta property="og:title" content="Phòng Thi Trực Tuyến">
    <meta property="og:description" content="Làm bài kiểm tra trực tuyến">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Space Mono, Space Grotesk & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Neo-Brutalism Design System -->
    <link rel="stylesheet" href="assets/css/neobrutalism.css">

    <style>
        body {
            font-family: var(--font-display);
            background-color: var(--neo-cream);
            background-image: radial-gradient(#000000 1px, transparent 1px);
            background-size: 24px 24px;
            min-height: 100vh;
        }

        /* Role Tabs */
        .role-tab {
            flex: 1;
            padding: 12px 18px;
            border-radius: 10px;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            border: 2px solid transparent;
            background: transparent;
            color: var(--neo-black);
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            user-select: none;
        }

        .role-tab.active {
            background: var(--neo-black) !important;
            color: var(--neo-white) !important;
            border-color: var(--neo-black) !important;
            box-shadow: 2.5px 2.5px 0px rgba(0, 0, 0, 0.3);
        }

        .role-tab.active i,
        .role-tab.active svg {
            color: var(--neo-white) !important;
        }

        .role-tab:not(.active):hover {
            background: rgba(0, 0, 0, 0.05);
        }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--neo-white);
            color: var(--neo-black);
            border: 2.5px solid #000;
            box-shadow: 4px 4px 0px #000;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 99999;
            max-width: 380px;
        }
        #toast.show { transform: translateY(0); opacity: 1; }
        #toast.success { background: var(--neo-mint); }
        #toast.error { background: #FFD1D5; color: #9B1C1C; }
        #toast.info { background: var(--neo-blue-light); }
        #toast.warning { background: var(--neo-yellow-light); }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4 md:p-6 antialiased">

    <!-- Toast notification -->
    <div id="toast">
        <i data-lucide="bell" class="w-5 h-5 shrink-0 text-black"></i>
        <span id="toastMsg">Thông báo</span>
    </div>

    <!-- Main Container -->
    <div class="w-full max-w-md my-auto py-8">

        <!-- Top branding logo (Stylized NOADD logo) -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center p-3 px-6 rounded-2xl border-[2.5px] border-black bg-white shadow-[4px_4px_0px_#000] mb-3">
                <img src="assets/images/logo-noadd.png" alt="NOADD" class="h-10 md:h-12 w-auto object-contain">
            </div>
            <h1 class="font-typewriter text-2xl md:text-3xl font-black text-black tracking-tight mt-1">
                CỔNG THI TRỰC TUYẾN
            </h1>
            <p class="text-xs font-bold text-neutral-600 mt-1 uppercase tracking-wider">
                Khảo sát &amp; Kiểm tra Khối 6 THCS
            </p>
        </div>

        <!-- Auth Card (Neo-Brutalist Card) -->
        <div class="neo-card p-6 md:p-8 bg-white border-[3px] border-black shadow-[6px_6px_0px_#000]">

            <!-- Role Selector Tabs -->
            <div class="grid grid-cols-2 gap-2 bg-[#F6F2E5] p-1.5 rounded-xl border-2 border-black mb-6">
                <button
                    id="tabTeacher"
                    class="role-tab active"
                    onclick="switchTab('teacher')"
                >
                    <i data-lucide="graduation-cap" class="w-4 h-4"></i>
                    Giáo Viên
                </button>
                <button
                    id="tabStudent"
                    class="role-tab"
                    onclick="switchTab('student')"
                >
                    <i data-lucide="user" class="w-4 h-4"></i>
                    Học Sinh
                </button>
            </div>

            <!-- ===== GIÁO VIÊN FORM ===== -->
            <div id="teacherForm" class="auth-form space-y-4">
                <div class="mb-4">
                    <h2 class="font-typewriter text-base font-black text-black uppercase">
                        Quản Trị Giáo Viên
                    </h2>
                    <p class="text-xs font-semibold text-neutral-500 mt-0.5">Đăng nhập để vào Studio soạn đề &amp; quản lý điểm</p>
                </div>

                <!-- Tài khoản -->
                <div>
                    <label class="font-typewriter text-[11px] font-black text-black uppercase block mb-1">Tài Khoản</label>
                    <input type="text" id="teacherEmail" class="neo-input"
                        placeholder="Nhập tài khoản"
                        autocomplete="username"
                        onkeydown="if(event.key==='Enter') handleTeacherAuth()">
                </div>

                <!-- Password -->
                <div>
                    <label class="font-typewriter text-[11px] font-black text-black uppercase block mb-1">Mật Khẩu</label>
                    <div class="relative">
                        <input type="password" id="teacherPassword" class="neo-input pr-12"
                            placeholder="••••••••"
                            autocomplete="off"
                            onkeydown="if(event.key==='Enter') handleTeacherAuth()">
                        <button type="button" onclick="togglePassword('teacherPassword')"
                            class="absolute right-3.5 top-1/2 -translate-y-1/2 text-neutral-600 hover:text-black">
                            <i data-lucide="eye" class="w-4 h-4" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="button" onclick="handleTeacherAuth()" class="neo-btn neo-btn-yellow w-full py-3 text-sm uppercase tracking-wider mt-2">
                    <i data-lucide="shield-check" class="w-4 h-4"></i>
                    <span>Đăng Nhập Quản Lý</span>
                </button>
            </div>

            <!-- ===== HỌC SINH FORM ===== -->
            <div id="studentForm" class="auth-form hidden space-y-4">
                <div class="mb-4">
                    <h2 class="font-typewriter text-base font-black text-black uppercase">
                        Vào Phòng Thi
                    </h2>
                    <p class="text-xs font-semibold text-neutral-500 mt-0.5">Nhập mã phòng do giáo viên cung cấp</p>
                </div>

                <!-- Mã đề thi (Chunky prominent input) -->
                <div>
                    <label class="font-typewriter text-[11px] font-black text-black uppercase block mb-1">Mã Phòng Thi (6 Chữ Số)</label>
                    <input type="text" id="examCode" class="neo-input font-typewriter text-2xl font-black text-center tracking-widest bg-[#FFE28A]/40 border-2 border-black"
                        placeholder="123456"
                        maxlength="6"
                        inputmode="numeric"
                        pattern="[0-9]*"
                        autocomplete="off"
                        oninput="this.value=this.value.replace(/[^0-9]/g, '')"
                        onkeydown="if(event.key==='Enter') handleStudentEnter()">
                    <p class="text-[11px] font-bold text-neutral-500 mt-1 text-center">Chỉ gồm các chữ số (ví dụ: 123456)</p>
                </div>

                <div class="border-t-2 border-black/10 pt-3">
                    <span class="font-typewriter text-[10px] font-black uppercase text-neutral-500 block mb-2">Thông tin học sinh</span>
                    
                    <!-- Họ tên -->
                    <div class="mb-3">
                        <label class="text-[11px] font-bold text-neutral-700 block mb-1">Họ và tên học sinh</label>
                        <input type="text" id="studentName" class="neo-input"
                            placeholder="Nguyễn Văn A">
                    </div>

                    <!-- Lớp -->
                    <div>
                        <label class="text-[11px] font-bold text-neutral-700 block mb-1">Lớp</label>
                        <input type="text" id="studentClass" class="neo-input"
                            placeholder="6A1">
                    </div>
                </div>

                <button onclick="handleStudentEnter()" class="neo-btn neo-btn-mint w-full py-3 text-sm uppercase tracking-wider mt-2">
                    <i data-lucide="play-circle" class="w-4 h-4"></i>
                    Bắt Đầu Làm Bài
                </button>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/core/default-exam.js"></script>
    <script src="assets/js/core/storage.js"></script>

    <script>
        // ============================================================
        // UI STATE
        // ============================================================
        let currentTab = 'teacher';
        let teacherMode = 'login'; // 'login' | 'register'

        // ============================================================
        // ICONS INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            checkAutoLogin();
        });

        /**
         * Kiểm tra nếu đã đăng nhập → chuyển thẳng vào studio
         */
        function checkAutoLogin() {
            const user = Storage.Auth.getCurrentUser();
            if (user && user.role === 'teacher') {
                window.location.href = 'studio.html';
            }
        }

        // ============================================================
        // TAB SWITCHING
        // ============================================================
        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('teacherForm').classList.toggle('hidden', tab !== 'teacher');
            document.getElementById('studentForm').classList.toggle('hidden', tab !== 'student');
            document.getElementById('tabTeacher').classList.toggle('active', tab === 'teacher');
            document.getElementById('tabStudent').classList.toggle('active', tab === 'student');
            lucide.createIcons();
        }

        // ============================================================
        // TEACHER AUTH & OTP VERIFICATION
        // ============================================================
        let currentGeneratedOtp = null;
        let otpCountdown = 0;
        let otpTimerInterval = null;

        // ============================================================
        // TEACHER AUTH (TÀI KHOẢN TỰ CẤP - XÁC THỰC SHA-256)
        // ============================================================
        async function handleTeacherAuth() {
            const email = document.getElementById('teacherEmail').value.trim();
            const password = document.getElementById('teacherPassword').value;

            if (!email) return showToast('Vui lòng nhập tài khoản!', 'error');
            if (!password) return showToast('Vui lòng nhập mật khẩu!', 'error');

            showToast('Đang xác thực thông tin...', 'info');

            // Gọi hàm login kiểm tra SHA-256 hash từ data/teachers.json
            const result = await Storage.Auth.login(email, password);
            if (!result.success) {
                return showToast(result.message, 'error');
            }

            showToast(`Xin chào, ${result.user.name || 'Giáo viên'}! Đang vào hệ thống...`, 'success');
            setTimeout(() => {
                window.location.href = 'studio.html';
            }, 500);
        }

        // ============================================================
        // BẢO VỆ CHỐNG F12 / F11 / INSPECT ELEMENT / XEM MÃ NGUỒN
        // ============================================================
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            showToast('Chức năng chuột phải bị khóa để bảo vệ hệ thống!', 'warning');
        });

        document.addEventListener('keydown', (e) => {
            // Chặn F12, F11
            if (e.key === 'F12' || e.key === 'F11') {
                e.preventDefault();
                showToast('Chức năng F11/F12 bị khóa để bảo mật quyền quản trị!', 'warning');
                return false;
            }
            // Chặn Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C (Inspect DevTools)
            if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C', 'i', 'j', 'c'].includes(e.key)) {
                e.preventDefault();
                showToast('Không có quyền mở DevTools trên trang này!', 'warning');
                return false;
            }
            // Chặn Ctrl+U (View Source)
            if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) {
                e.preventDefault();
                showToast('Xem mã nguồn bị khóa!', 'warning');
                return false;
            }
        });

        // ============================================================
        // STUDENT ENTRANCE
        // ============================================================
        function handleStudentEnter() {
            const code = document.getElementById('examCode').value.replace(/[^0-9]/g, '').trim();
            const name = document.getElementById('studentName').value.trim();
            const cls = document.getElementById('studentClass').value.trim();
            const id = document.getElementById('studentId')?.value.trim() || '';

            if (!code) return showToast('Vui lòng nhập mã đề thi (chỉ gồm các chữ số)!', 'error');
            if (!name) return showToast('Vui lòng nhập họ và tên!', 'error');

            // Kiểm tra mã đề thi
            const exam = Storage.Exams.getByCode(code);
            if (!exam) return showToast(`Không tìm thấy đề thi "${code}"! Kiểm tra lại mã.`, 'error');
            if (!exam.isActive) return showToast('Đề thi này hiện không hoạt động.', 'error');

            // Lưu session học sinh
            Storage.Session.save({
                examCode: code,
                studentName: name,
                studentClass: cls,
                studentId: id,
                startTime: new Date().toISOString(),
            });

            showToast('Tìm thấy đề thi! Đang vào phòng thi...', 'success');
            setTimeout(() => {
                window.location.href = `exam.html?code=${code}`;
            }, 600);
        }

        // ============================================================
        // UTILITIES
        // ============================================================
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('name', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('name', 'eye');
            }
            lucide.createIcons();
        }

        // ============================================================
        // TOAST
        // ============================================================
        let toastTimeout;
        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = msg;
            toast.className = `show ${type}`;
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
